<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Album Rogaczy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="album-stage">

        <!-- =========================
             OKŁADKA PRZEDNIA
        ========================== -->

        <section class="cover-screen active" id="coverScreen">

            <button
                class="cover-button"
                id="openAlbum"
                type="button"
                aria-label="Otwórz Album Rogaczy"
            >

                <img
                    src="images/okladka.jpg"
                    alt="Album Rogaczy"
                >

            </button>

        </section>


        <!-- =========================
             ŚRODEK ALBUMU
        ========================== -->

        <section class="album-screen" id="albumScreen">

            <div class="book-shell">

                <div class="book" id="book">

                    <!--
                        Tutaj JavaScript będzie
                        podmieniał kolejne grafiki.
                    -->

                    <img
                        id="pageImage"
                        class="page-image"
                        src="images/poznajnas.png"
                        alt="Rozkładówka Albumu Rogaczy"
                    >


                    <!-- EFEKT PRZEWRACANIA KARTKI -->

                    <div
                        class="turn-sheet"
                        id="turnSheet"
                        aria-hidden="true"
                    >
                        <div class="turn-shadow"></div>
                    </div>


                    <!-- ŚRODEK / GRZBIET ALBUMU -->

                    <div class="spine"></div>

                </div>

            </div>


            <!-- =========================
                 PRZYCISKI
            ========================== -->

            <nav class="navigation">

                <button
                    id="prevBtn"
                    type="button"
                    aria-label="Poprzednia strona"
                >
                    ←
                </button>


                <div id="pageCounter">
                    1 / 9
                </div>


                <button
                    id="nextBtn"
                    type="button"
                    aria-label="Następna strona"
                >
                    →
                </button>

            </nav>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
