<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Album Rogaczy</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<main class="album-stage">


    <!-- =====================================================
         OKŁADKA
    ====================================================== -->

    <section
        class="cover-view active"
        id="coverView"
    >

        <button
            class="cover-button"
            id="openAlbum"
            type="button"
            aria-label="Otwórz Album Rogaczy"
        >

            <img
                src="./images/okladka.jpg"
                alt="Album Rogaczy"
            >

        </button>

    </section>



    <!-- =====================================================
         OTWARTY ALBUM
    ====================================================== -->

    <section
        class="book-view"
        id="bookView"
    >

        <div
            class="book"
            id="book"
        >


            <!--
            ================================================
            AKTUALNA ROZKŁADÓWKA
            ================================================
            -->

            <img
                id="currentSpread"
                class="current-spread"
                src="./images/poznaj-nas.png"
                alt="Rozkładówka Albumu Rogaczy"
            >



            <!--
            ================================================
            NASTĘPNA / POPRZEDNIA ROZKŁADÓWKA POD SPODem
            ================================================
            -->

            <img
                id="underSpread"
                class="under-spread"
                src=""
                alt=""
            >



            <!--
            ================================================
            NIERUCHOMA POŁOWA AKTUALNEJ STRONY

            Przy przejściu do przodu:
            zostaje lewa połowa aktualnej rozkładówki.

            Przy cofaniu:
            zostaje prawa połowa aktualnej rozkładówki.
            ================================================
            -->

            <div
                class="fixed-half"
                id="fixedHalf"
            ></div>



            <!--
            ================================================
            PRZEWRACANA KARTKA
            ================================================
            -->

            <div
                class="flip-page"
                id="flipPage"
            >

                <div
                    class="flip-face flip-front"
                    id="flipFront"
                ></div>


                <div
                    class="flip-face flip-back"
                    id="flipBack"
                ></div>

            </div>



            <!-- cień grzbietu -->

            <div class="book-spine"></div>


        </div>



        <!-- =================================================
             NAWIGACJA
        ================================================== -->

        <nav class="controls">


            <button
                id="prevPage"
                type="button"
                aria-label="Poprzednia strona"
            >
                ←
            </button>


            <div id="counter">
                1 / 3
            </div>


            <button
                id="nextPage"
                type="button"
                aria-label="Następna strona"
            >
                →
            </button>


        </nav>


    </section>


</main>


<script src="script.js"></script>

</body>

</html>
