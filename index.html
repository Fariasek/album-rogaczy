<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Album Rogaczy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="album-stage">

    <!-- =========================================
         OKŁADKA
    ========================================== -->

    <section class="cover-screen active" id="coverScreen">

        <button
            class="cover-button"
            id="openAlbum"
            type="button"
            aria-label="Otwórz Album Rogaczy"
        >

            <img
                src="./images/okladka.jpg"
                alt="Album Rogaczy"
            >

        </button>

    </section>


    <!-- =========================================
         OTWARTY ALBUM
    ========================================== -->

    <section class="album-screen" id="albumScreen">

        <div class="book-shell">

            <div class="book" id="book">

                <!-- aktualna rozkładówka -->

                <img
                    id="pageImage"
                    class="page-image"
                    src="./images/poznaj-nas.png"
                    alt="Album Rogaczy"
                >


                <!-- animowana kartka -->

                <div
                    class="turn-sheet"
                    id="turnSheet"
                    aria-hidden="true"
                >

                    <div class="turn-shadow"></div>

                </div>


                <!-- grzbiet książki -->

                <div class="spine"></div>

            </div>

        </div>


        <!-- =====================================
             NAWIGACJA
        ====================================== -->

        <nav class="navigation">

            <button
                id="prevBtn"
                type="button"
                aria-label="Poprzednia karta"
            >
                ←
            </button>


            <div id="pageCounter">
                1 / 8
            </div>


            <button
                id="nextBtn"
                type="button"
                aria-label="Następna karta"
            >
                →
            </button>

        </nav>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
