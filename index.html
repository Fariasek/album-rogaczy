<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Album Rogaczy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="album-stage">

        <section class="book">

            <div class="book-cover" id="bookCover">

                <div class="gold-frame"></div>

                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>

                <div class="ribbon"></div>

                <div class="cover-title">
                    Album<br>
                    Rogaczy
                </div>

                <div class="crest-holder">
                    <img
                        src="https://uhuncwot.xaa.pl/uploads/files/nowe/domy/1.png"
                        alt="Herb Rogaczy"
                    >
                </div>

                <div class="motto">
                    „Przysięgam, że knuję coś niedobrego”
                </div>

                <div class="cover-photo">

                    <div class="cover-photo-image">
                        🏰
                    </div>

                    <div class="cover-photo-caption">
                        Uniwersytet Huncwotów
                    </div>

                </div>

                <div class="wax-seal">
                    R
                </div>

                <div class="open-album">
                    ✦ kliknij, aby otworzyć ✦
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
