<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Album Rogaczy</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <main class="album-stage">

    <div class="album" id="album">


      <!-- =====================================================
           OKŁADKA
      ====================================================== -->

      <section
        class="album-view active"
        data-title="Okładka"
      >

        <button
          class="cover"
          id="openAlbum"
          type="button"
          aria-label="Otwórz Album Rogaczy"
        >

          <img
            src="images/okladka.jpg"
            alt="Okładka Albumu Rogaczy"
          >

        </button>

      </section>



      <!-- =====================================================
           POZNAJ NAS

           To będzie nowa pełna grafika 1:1,
           a nie strona składana z CSS.
      ====================================================== -->

      <section
        class="album-view"
        data-title="Poznaj nas"
      >

        <div class="spread">

          <img
            src="images/poznaj-nas.png"
            alt="Poznaj nas — Album Rogaczy"
          >

        </div>

      </section>



      <!-- =====================================================
           JEŻ

           ZOSTAWIAMY DOTYCHCZASOWĄ GRAFIKĘ
      ====================================================== -->

      <section
        class="album-view"
        data-title="???"
      >

        <div class="spread">

          <img
            src="images/jez.png"
            alt="Anonimowa rozkładówka Albumu Rogaczy"
          >

        </div>

      </section>



      <!-- =====================================================
           ALEX

           ZOSTAWIAMY DOTYCHCZASOWĄ GRAFIKĘ
      ====================================================== -->

      <section
        class="album-view"
        data-title="???"
      >

        <div class="spread">

          <img
            src="images/alex.png"
            alt="Anonimowa rozkładówka Albumu Rogaczy"
          >

        </div>

      </section>



      <!-- =====================================================
           TU BĘDZIEMY DODAWAĆ KOLEJNE OSOBY
      ====================================================== -->


    </div>



    <!-- =====================================================
         EFEKT PRZEWRACANEJ KARTKI

         Ten element będzie animowany w script.js
    ====================================================== -->

    <div
      class="page-turn"
      id="pageTurn"
      aria-hidden="true"
    >

      <div class="page-turn-front"></div>

      <div class="page-turn-back"></div>

    </div>



    <!-- =====================================================
         NAWIGACJA
    ====================================================== -->

    <nav
      class="album-controls"
      id="albumControls"
    >

      <button
        id="prevPage"
        type="button"
        aria-label="Poprzednia strona"
      >
        ←
      </button>


      <div
        class="page-name"
        id="pageName"
      >
        Okładka
      </div>


      <button
        id="nextPage"
        type="button"
        aria-label="Następna strona"
      >
        →
      </button>

    </nav>


  </main>


  <script src="script.js"></script>

</body>

</html>

</body>

</html>
